name: One-shot Yarn 4 migration

on:
  push:
    branches:
      - mymcp/task/upgrade-project-to-yarn-4-rnbp-001-yarn

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn 4.18.1 CLI
        run: npm install --global @yarnpkg/cli-dist@4.18.1

      - name: Migrate project to Yarn 4
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.packageManager = 'yarn@4.18.1';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          cat > .yarnrc.yml <<'YARNRC'
          nodeLinker: node-modules
          enableScripts: true
          YARNRC

          rm -f package-lock.json
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Verify immutable install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn jest --runInBand

      - name: Remove one-shot workflow
        run: rm .github/workflows/yarn-upgrade.yml

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: upgrade project to Yarn 4.18.1"
          git push origin HEAD:"$GITHUB_REF_NAME"
