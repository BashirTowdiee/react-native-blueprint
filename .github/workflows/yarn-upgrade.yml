name: Finalise Yarn 4 migration

on:
  push:
    branches:
      - mymcp/task/upgrade-project-to-yarn-4-rnbp-001-yarn

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Yarn 4.18.1 CLI
        run: npm install --global @yarnpkg/cli-dist@4.18.1

      - name: Regenerate lockfile
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Verify immutable install
        run: yarn install --immutable

      - name: Unit tests
        run: yarn jest --runInBand

      - name: Remove one-shot workflow
        run: rm .github/workflows/yarn-upgrade.yml

      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: finalise Yarn 4.18.1 migration"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
